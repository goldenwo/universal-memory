version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # mem0ai bumps can NEVER pass as auto-PRs by construction: the package
      # is patch-package'd (version-pinned patch + sha256 source pin), so any
      # version change fails deps-guard on hash drift until the deliberate
      # reconciliation in server/patches/README.md §Reconciliation runs
      # (the #211/#231 shape). Version currency is owned by reconciliation
      # arcs + the quarterly #17 review. NOTE: `ignore` suppresses PRs only —
      # Dependabot security ALERTS for mem0ai still surface in the Security
      # tab, which remains the advisory path (#231 compensating control).
      - dependency-name: "mem0ai"

      # ollama must stay on 0.5.x: mem0ai@3.1.6 declares `peerOptional
      # ollama@^0.5.14`, so anything >=0.6 fails `npm ci` outright with
      # ERESOLVE (measured on PR #258, which bumped it to 0.6.3). This is a
      # HARD install failure, not a preference — the ceiling moves only when
      # a mem0ai reconciliation widens that peer range.
      - dependency-name: "ollama"
        versions: [">=0.6.0"]

      # @qdrant/js-client-rest must stay on 1.18.x: 1.19 removed the legacy
      # search API this codebase calls. Unlike the ollama pin this would NOT
      # fail install or the deps guard — it resolves cleanly and breaks
      # recall at runtime, which is exactly why it needs an ignore rather
      # than a failing PR to catch it. Revisit only alongside a deliberate
      # migration to the query API.
      - dependency-name: "@qdrant/js-client-rest"
        versions: [">=1.19.0"]

      # better-sqlite3 must stay on ^12: 13.x is an N-API rewrite that ships
      # binding.gyp with no install script, so `npm ci` (NOT `npm install` —
      # the verb difference IS the trap) fires the implicit node-gyp rule and
      # dies in the toolchain-free alpine image; reproduced under npm 10.9 and
      # 11.19, and 13.x releases carry zero prebuild assets. Measured during
      # #255; PR #212 was closed on it but no ignore was ever added, so the
      # bump kept re-proposing. Re-take when upstream drops binding.gyp from
      # the tarball or restores a prebuild-aware install.
      - dependency-name: "better-sqlite3"
        versions: [">=13.0.0"]

      # @anthropic-ai/sdk must stay on 0.x: 1.0.0 moves every request to API
      # version 2026-10-21, and Anthropic's migration guide says that version
      # answers 400 to any temperature, even the default. The judge and facts
      # send temperature 0 on models outside MODEL_CAPABILITIES, including the
      # Haiku 4.5 pin the v1.30.0 release notes give. Like the qdrant pin this
      # would NOT fail CI: the provider tests inject a fake client, so PR #418
      # passed the whole suite. No live call was made; a local stub showed the
      # version header change. Re-take when Haiku 4.5 retires or 2023-06-01 is
      # announced as ending.
      - dependency-name: "@anthropic-ai/sdk"
        versions: [">=1.0.0"]
