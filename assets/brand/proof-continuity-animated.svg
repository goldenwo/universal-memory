<svg viewBox="0 0 1600 640" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code','Consolas','DejaVu Sans Mono',monospace" role="img" aria-label="Session 1 ends mid-refactor; session 2 starts with the synthesized state-of-play injected before the user types anything.">
  <style>
    /* One 14s master loop. Every storyline element carries the SAME animation length;
       staggering is keyframe percentages, never animation-delay (delays don't loop).
       Base state = fully composed scene, so prefers-reduced-motion shows the finale. */
    .s { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .a1 { animation-name: k-a1; } .a2 { animation-name: k-a2; } .a3 { animation-name: k-a3; }
    .a4 { animation-name: k-a4; } .a5 { animation-name: k-a5; } .a6 { animation-name: k-a6; }
    .b1 { animation-name: k-b1; } .b2 { animation-name: k-b2; } .b3 { animation-name: k-b3; }
    .b4 { animation-name: k-b4; } .b5 { animation-name: k-b5; } .b6 { animation-name: k-b6; }
    .cap { animation-name: k-cap; }
    .pulse { animation-name: k-pulse; }
    @keyframes k-a1  { 0%, 3% { opacity: 0; } 5%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-a2  { 0%, 7% { opacity: 0; } 9%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-a3  { 0%, 11% { opacity: 0; } 13%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-a4  { 0%, 17% { opacity: 0; } 19%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-a5  { 0%, 24% { opacity: 0; } 26%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-a6  { 0%, 30% { opacity: 0; } 33%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-b1  { 0%, 43% { opacity: 0; } 46%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-b2  { 0%, 48% { opacity: 0; } 50%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-b3  { 0%, 52% { opacity: 0; } 54%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-b4  { 0%, 56% { opacity: 0; } 58%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-b5  { 0%, 60% { opacity: 0; } 62%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-b6  { 0%, 64% { opacity: 0; } 66%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes k-cap { 0%, 70% { opacity: 0; } 74%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    /* The memory pulse: rises out of Panel A's checkpoint line, arcs the gap, lands on the
       briefing block. Visible only inside its window. */
    @keyframes k-pulse {
      0%, 33%   { opacity: 0; transform: translate(430px, 545px) scale(0.4); }
      35%       { opacity: 1; transform: translate(430px, 505px) scale(1); }
      39%       { opacity: 1; transform: translate(810px, 120px) scale(1); }
      43%       { opacity: 0.9; transform: translate(1030px, 128px) scale(1.4); }
      45%, 100% { opacity: 0; transform: translate(1030px, 128px) scale(0.2); }
    }
    .blink { animation: k-blink 1.1s steps(1) infinite; }
    @keyframes k-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .s, .pulse { animation: none; }
      .pulse { opacity: 0; }
    }
  </style>

  <rect x="0" y="0" width="1600" height="640" fill="#11111b"/>

  <!-- ───────── Panel A chrome (static) ───────── -->
  <rect x="20" y="20" width="770" height="600" rx="10" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
  <path d="M20 30 a10 10 0 0 1 10 -10 h750 a10 10 0 0 1 10 10 v24 h-770 z" fill="#181825"/>
  <circle cx="42" cy="37" r="6" fill="#f38ba8"/>
  <circle cx="62" cy="37" r="6" fill="#f9e2af"/>
  <circle cx="82" cy="37" r="6" fill="#a6e3a1"/>
  <text x="405" y="42" font-size="14" fill="#a6adc8" text-anchor="middle">session 1 — Tuesday, 6:14 PM</text>

  <!-- Panel A storyline -->
  <g font-size="15" xml:space="preserve">
    <text class="s a1" x="44" y="95" fill="#89b4fa"><tspan x="44" dy="0">user&gt; Our rate limiter still over-admits at window</tspan><tspan x="44" dy="22">      boundaries. Refactor middleware/rateLimiter.ts</tspan><tspan x="44" dy="22">      to a sliding-window log?</tspan></text>
    <text class="s a2" x="44" y="185" fill="#cdd6f4"><tspan x="44" dy="0">claude&gt; Reading middleware/rateLimiter.ts…</tspan></text>
    <text class="s a3" x="44" y="225" fill="#cdd6f4"><tspan x="44" dy="0">  Rewrote acquire() as a sliding-window log.</tspan><tspan x="44" dy="22">  Running tests…</tspan></text>
    <text class="s a4" x="44" y="290" fill="#cdd6f4"><tspan x="44" dy="0">  rateLimiter.test.ts: <tspan fill="#a6e3a1">14 passed</tspan>, <tspan fill="#f38ba8">3 failed</tspan></tspan><tspan x="44" dy="22">  Burst-edge cases still failing — boundary math</tspan><tspan x="44" dy="22">  in slidingLog() needs another pass.</tspan></text>
    <text class="s a5" x="44" y="420" fill="#6c7086"><tspan x="44" dy="0">^C — you head to dinner, refactor unfinished</tspan></text>
    <text class="s a6" x="44" y="530"><tspan x="44" dy="0" fill="#7c7ce8">SessionEnd → state-of-play synthesized</tspan><tspan fill="#a6e3a1"> ✓</tspan></text>
  </g>

  <!-- ───────── Panel B chrome (static) ───────── -->
  <rect x="810" y="20" width="770" height="600" rx="10" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
  <path d="M810 30 a10 10 0 0 1 10 -10 h750 a10 10 0 0 1 10 10 v24 h-770 z" fill="#181825"/>
  <circle cx="832" cy="37" r="6" fill="#f38ba8"/>
  <circle cx="852" cy="37" r="6" fill="#f9e2af"/>
  <circle cx="872" cy="37" r="6" fill="#a6e3a1"/>
  <text x="1195" y="42" font-size="14" fill="#a6adc8" text-anchor="middle">session 2 — Wednesday, 9:02 AM</text>

  <!-- Panel B storyline -->
  <g font-size="15" xml:space="preserve">
    <text class="s b1" x="834" y="95" fill="#7c7ce8">[state-of-play — injected at session start]</text>
    <rect class="s b2" x="834" y="112" width="4" height="230" rx="2" fill="#7c7ce8"/>
    <text class="s b3" x="858" y="145" fill="#cdd6f4"><tspan x="858" dy="0"><tspan fill="#7c7ce8">Focus:</tspan> sliding-window rate limiter refactor</tspan></text>
    <text class="s b4" x="858" y="205" fill="#cdd6f4"><tspan x="858" dy="0"><tspan fill="#7c7ce8">In flight:</tspan> 3 burst-edge tests failing in</tspan><tspan x="858" dy="22">           rateLimiter.test.ts</tspan></text>
    <text class="s b5" x="858" y="285" fill="#cdd6f4"><tspan x="858" dy="0"><tspan fill="#7c7ce8">Next:</tspan> fix boundary math in slidingLog();</tspan><tspan x="858" dy="22">      re-run the burst suite</tspan></text>
    <g class="s b6">
      <text x="834" y="420" font-size="15" fill="#89b4fa">user&gt;</text>
      <rect class="blink" x="898" y="406" width="10" height="18" fill="#cdd6f4"/>
    </g>
    <text class="s cap" x="1195" y="560" font-size="19" fill="#f0f3f6" text-anchor="middle" font-style="italic">injected before you typed anything.</text>
  </g>

  <!-- The memory pulse (decorative; hidden from AT) -->
  <g class="pulse s" aria-hidden="true" opacity="0">
    <circle r="9" fill="#7c7ce8"/>
    <circle r="16" fill="none" stroke="#7c7ce8" stroke-opacity="0.45" stroke-width="2"/>
  </g>
</svg>
