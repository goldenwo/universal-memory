<svg viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code','Consolas','DejaVu Sans Mono',monospace" role="img" aria-label="A fact captured in a Claude Code session lands in the vault as a markdown file, then a question asked on a phone recalls it — one vault, every surface.">
  <style>
    /* One 12s master loop; staggering by keyframe percentages (delays don't loop).
       Base state = fully composed scene → prefers-reduced-motion shows the finale.
       No gradients, no glow, no filters: flat strokes and type only. */
    .s { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .e1 { animation-name: k-e1; } .e2 { animation-name: k-e2; } .e3 { animation-name: k-e3; }
    .e4 { animation-name: k-e4; } .e5 { animation-name: k-e5; }
    .cap { animation-name: k-cap; }
    @keyframes k-e1  { 0%, 4%  { opacity: 0; } 7%, 95%  { opacity: 1; } 99%, 100% { opacity: 0; } } /* captured ✓ line */
    @keyframes k-e2  { 0%, 24% { opacity: 0; } 26%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } } /* vault gains the fact */
    @keyframes k-e3  { 0%, 38% { opacity: 0; } 41%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } } /* phone question */
    @keyframes k-e4  { 0%, 62% { opacity: 0; } 65%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } } /* phone answer */
    @keyframes k-e5  { 0%, 4%  { opacity: 0; } 7%, 95%  { opacity: 1; } 99%, 100% { opacity: 0; } } /* spare (unused) */
    @keyframes k-cap { 0%, 72% { opacity: 0; } 76%, 95% { opacity: 1; } 99%, 100% { opacity: 0; } }
    /* Cursor-block chips: memory in motion. Straight travel along the drawn lines. */
    .chipA { animation-name: k-chipA; } .chipB { animation-name: k-chipB; } .chipC { animation-name: k-chipC; }
    @keyframes k-chipA { /* terminal → vault (capture) */
      0%, 9%    { opacity: 0; transform: translate(408px, 172px); }
      11%       { opacity: 1; transform: translate(408px, 172px); }
      21%       { opacity: 1; transform: translate(596px, 172px); }
      23%, 100% { opacity: 0; transform: translate(596px, 172px); }
    }
    @keyframes k-chipB { /* phone → vault (the question goes looking) */
      0%, 44%   { opacity: 0; transform: translate(1266px, 212px); }
      46%       { opacity: 1; transform: translate(1266px, 212px); }
      54%       { opacity: 1; transform: translate(1014px, 212px); }
      56%, 100% { opacity: 0; transform: translate(1014px, 212px); }
    }
    @keyframes k-chipC { /* vault → phone (the answer comes back) */
      0%, 55%   { opacity: 0; transform: translate(1014px, 212px); }
      57%       { opacity: 1; transform: translate(1014px, 212px); }
      63%       { opacity: 1; transform: translate(1266px, 212px); }
      65%, 100% { opacity: 0; transform: translate(1266px, 212px); }
    }
    .blink { animation: k-blink 1.1s steps(1) infinite; }
    @keyframes k-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .s, .chipA, .chipB, .chipC { animation: none; }
      .chipA, .chipB, .chipC { opacity: 0; }
    }
  </style>

  <rect x="0" y="0" width="1600" height="600" fill="#11111b"/>

  <!-- ───── LEFT: Claude Code session (capture source) ───── -->
  <rect x="40" y="80" width="368" height="180" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
  <path d="M40 88 a8 8 0 0 1 8 -8 h352 a8 8 0 0 1 8 8 v22 h-368 z" fill="#181825"/>
  <circle cx="60" cy="95" r="5" fill="#f38ba8"/><circle cx="77" cy="95" r="5" fill="#f9e2af"/><circle cx="94" cy="95" r="5" fill="#a6e3a1"/>
  <text x="224" y="100" font-size="13" fill="#a6adc8" text-anchor="middle">Claude Code — session</text>
  <text x="62" y="140" font-size="14" fill="#6c7086">…rate-limiter refactor wraps up</text>
  <text class="s e1" x="62" y="182" font-size="14"><tspan fill="#cdd6f4">SessionEnd → captured</tspan><tspan fill="#a6e3a1"> ✓</tspan></text>
  <text x="62" y="224" font-size="13" fill="#6c7086">automatic — no "remember" needed</text>

  <!-- also-capture strip -->
  <rect x="40" y="300" width="368" height="46" rx="8" fill="none" stroke="#313244" stroke-width="1"/>
  <text x="224" y="328" font-size="13" fill="#6c7086" text-anchor="middle">also: bots · um CLI · saying "remember…"</text>

  <!-- capture line: terminal → vault -->
  <line x1="412" y1="172" x2="600" y2="172" stroke="#45475a" stroke-width="1.5"/>
  <path d="M600 172 l-9 -5 v10 z" fill="#45475a"/>
  <text x="506" y="160" font-size="12" fill="#6c7086" text-anchor="middle" letter-spacing="2">CAPTURE</text>

  <!-- ───── CENTER: the vault, drawn as what it is — files ───── -->
  <rect x="614" y="60" width="400" height="310" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="1"/>
  <path d="M614 68 a8 8 0 0 1 8 -8 h384 a8 8 0 0 1 8 8 v22 h-400 z" fill="#181825"/>
  <circle cx="634" cy="75" r="5" fill="#f38ba8"/><circle cx="651" cy="75" r="5" fill="#f9e2af"/><circle cx="668" cy="75" r="5" fill="#a6e3a1"/>
  <text x="814" y="80" font-size="13" fill="#a6adc8" text-anchor="middle">~/vault</text>
  <g font-size="14" fill="#cdd6f4" xml:space="preserve">
    <text x="638" y="128"><tspan fill="#6c7086">├─</tspan> state/universal-memory/state.md</text>
    <text x="638" y="158"><tspan fill="#6c7086">├─</tspan> sessions/2026-07-29-refactor.md</text>
    <text x="638" y="188"><tspan fill="#6c7086">├─</tspan> decisions/0007-rate-limiting.md</text>
    <text class="s e2" x="638" y="218"><tspan fill="#7c7ce8">└─ + fact: "sliding-window limiter"</tspan></text>
  </g>
  <text x="638" y="272" font-size="13" fill="#6c7086">markdown you can open + a local index</text>
  <text x="638" y="296" font-size="13" fill="#6c7086">git-friendly · greppable · yours</text>
  <text x="814" y="345" font-size="13" fill="#a6adc8" text-anchor="middle">one vault — on your hardware</text>

  <!-- recall line: vault ↔ phone -->
  <line x1="1018" y1="212" x2="1262" y2="212" stroke="#45475a" stroke-width="1.5"/>
  <path d="M1018 212 l9 -5 v10 z" fill="#45475a"/>
  <path d="M1262 212 l-9 -5 v10 z" fill="#45475a"/>
  <text x="1140" y="200" font-size="12" fill="#6c7086" text-anchor="middle" letter-spacing="2">RECALL</text>
  <text x="1140" y="232" font-size="12" fill="#6c7086" text-anchor="middle">MCP · REST · OAuth</text>

  <!-- ───── RIGHT: phone (claude.ai), later that day ───── -->
  <rect x="1276" y="48" width="230" height="330" rx="22" fill="#1e1e2e" stroke="#313244" stroke-width="1.5"/>
  <rect x="1366" y="62" width="50" height="5" rx="2.5" fill="#313244"/>
  <text x="1391" y="94" font-size="13" fill="#a6adc8" text-anchor="middle">claude.ai — phone</text>
  <!-- question bubble (user, right-aligned) -->
  <g class="s e3">
    <rect x="1330" y="116" width="160" height="64" rx="10" fill="#313244"/>
    <text font-size="13" fill="#cdd6f4"><tspan x="1342" y="140">where did we land</tspan><tspan x="1342" y="158">on rate limiting?</tspan></text>
  </g>
  <!-- answer bubble (assistant, indigo border = memory surfacing) -->
  <g class="s e4">
    <rect x="1292" y="200" width="176" height="100" rx="10" fill="#1e1e2e" stroke="#7c7ce8" stroke-width="1.5"/>
    <text font-size="13" fill="#cdd6f4"><tspan x="1304" y="224">sliding-window</tspan><tspan x="1304" y="242">limiter — 3 burst-</tspan><tspan x="1304" y="260">edge tests still</tspan><tspan x="1304" y="278">failing.</tspan></text>
    <rect class="blink" x="1374" y="266" width="8" height="14" fill="#7c7ce8"/>
  </g>
  <!-- also-recall strip -->
  <rect x="1276" y="398" width="230" height="46" rx="8" fill="none" stroke="#313244" stroke-width="1"/>
  <text x="1391" y="426" font-size="13" fill="#6c7086" text-anchor="middle">also: ChatGPT · Desktop</text>

  <!-- caption -->
  <text class="s cap" x="800" y="540" font-size="19" fill="#f0f3f6" text-anchor="middle" font-style="italic">a fact captured once, recalled anywhere.</text>

  <!-- traveling cursor blocks (decorative) -->
  <g aria-hidden="true">
    <rect class="chipA s" x="-5" y="-8" width="10" height="16" fill="#7c7ce8" opacity="0"/>
    <rect class="chipB s" x="-5" y="-8" width="10" height="16" fill="#7c7ce8" opacity="0"/>
    <rect class="chipC s" x="-5" y="-8" width="10" height="16" fill="#7c7ce8" opacity="0"/>
  </g>
</svg>
